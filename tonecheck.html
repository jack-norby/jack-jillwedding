<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
body{background:#F7F2E9;margin:0;padding:26px;font:11px -apple-system,sans-serif;color:#8A6247;text-align:center}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:900px;margin:0 auto}
figure{margin:0}
.box{position:relative;height:210px;overflow:hidden}
.box img{width:100%;height:100%;object-fit:cover;object-position:58% center;display:block}
.box::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(247,242,233,.40) 0%,rgba(247,242,233,.44) 38%,rgba(247,242,233,.74) 100%)}
figcaption{padding-top:7px;letter-spacing:.08em;text-transform:uppercase}
.a img{filter:none}
.b img{filter:sepia(.45) saturate(1.05) contrast(.96)}
.c img{filter:sepia(.72) saturate(1.1) contrast(.94) brightness(1.03)}
.d img{filter:sepia(1) saturate(1.25) contrast(.92) brightness(1.04)}
</style></head><body>
<div class="row">
<figure class="a"><div class="box"><img src="hero.jpg"></div><figcaption>A &mdash; none (current)</figcaption></figure>
<figure class="b"><div class="box"><img src="hero.jpg"></div><figcaption>B &mdash; light warmth</figcaption></figure>
<figure class="c"><div class="box"><img src="hero.jpg"></div><figcaption>C &mdash; warm sepia</figcaption></figure>
<figure class="d"><div class="box"><img src="hero.jpg"></div><figcaption>D &mdash; full sepia</figcaption></figure>
</div>
</body></html>
